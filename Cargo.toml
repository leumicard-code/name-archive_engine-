[package]
name = "archive_engine"     #//היה 28 לפני כן
version = "0.3.0"
edition = "2021"
description = "Fast archive tool and GUI for Linux"
license = "MIT"

[lib]
name = "archive_engine"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "archive-engine"
path = "src/main.rs"

[[bin]]
name = "archive-engine-gui"
path = "src/gui_main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
tar = "0.4"
zstd = "0.13"
flate2 = "1.0"
walkdir = "2.4"
anyhow = "1.0"
sevenz-rust = { version = "0.6", features = ["compress"] }
rfd = "0.15"
indicatif = "0.17"
xz2 = "0.1"

# ממשק משתמש מבוסס חומרה (Wayland / X11)
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
    "x11"
] }
egui = "0.36"             # קריטי שנדבר לאותו גרסת מנוע
egui-elegance = "0.16"    # ספריית הTheme החדשה

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
